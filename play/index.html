<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KLIMB · The Marketing Career Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F0D1A;--s1:#1A1730;--s2:#242045;--s3:#332C5E;--tx:#F5F3FF;--mu:#A39DC8;
  --lime:#B8FF3C;--limeD:#6FA81A;--vio:#7B5CFF;--vioD:#4F33D1;--pink:#FF4F8B;--gold:#FFC83D;--cyan:#36D6FF;
  --ok:#3DDC84;--okBg:#123826;--bad:#FF5C6C;--badBg:#3D1420;
  --disp:'Bricolage Grotesque',system-ui,sans-serif;--body:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07060D;color:var(--tx);font-family:var(--body)}
body{background:radial-gradient(1200px 600px at 20% -10%,#2a1c63 0%,transparent 60%),radial-gradient(900px 500px at 110% 110%,#173a2a 0%,transparent 55%),#07060D}
button{font-family:inherit;color:inherit}
#app{max-width:440px;margin:0 auto;height:100vh;height:100dvh;position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 0 0 1px #221d3f,0 30px 80px rgba(0,0,0,.6);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:480px){#app{height:min(900px,calc(100dvh - 40px));margin-top:20px;border-radius:36px}}
#screen{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:20px}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.01em}
.mu{color:var(--mu)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:17px 16px;font:800 16px/1 var(--disp);letter-spacing:.04em;text-transform:uppercase;background:var(--lime);color:#13200A;box-shadow:0 5px 0 var(--limeD);cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--limeD)}
.btn:disabled{background:var(--s3);color:#7a73a8;box-shadow:0 5px 0 #1d1838;cursor:default}
.btn.ghost{background:transparent;color:var(--mu);box-shadow:none;border:2px solid var(--s3)}
.btn.vio{background:var(--vio);color:#fff;box-shadow:0 5px 0 var(--vioD)}
.btn.red{background:var(--bad);color:#2a060c;box-shadow:0 5px 0 #a8303d}
.btn.btn:disabled{background:var(--s3);color:#7a73a8;box-shadow:0 5px 0 #1d1838;cursor:default}
.btn.sm{padding:12px 14px;font-size:13px;border-radius:12px;width:auto;display:inline-block}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--s2);font:700 14px/1 var(--body);border:0;cursor:pointer;white-space:nowrap}
.card{background:var(--s1);border:2px solid var(--s2);border-radius:20px;padding:16px}
.bar{height:12px;border-radius:99px;background:var(--s3);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--lime);transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.bar>i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:9px;background:rgba(255,255,255,.35)}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(184,255,60,.55)}100%{box-shadow:0 0 0 22px rgba(184,255,60,0)}}
.bob{animation:bob 2.4s ease-in-out infinite}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}

/* Onboarding */
.ob{display:flex;flex-direction:column;height:100%;padding:20px}
.ob .top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.ob .back{background:none;border:0;font-size:22px;color:var(--mu);cursor:pointer;padding:4px 8px}
.ob h2{font-size:27px;line-height:1.15;margin-bottom:6px}
.ob .body{flex:1;overflow-y:auto;scrollbar-width:none}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;margin-bottom:10px;border-radius:16px;background:var(--s1);border:2px solid var(--s2);box-shadow:0 4px 0 var(--s2);cursor:pointer;font:500 16px/1.3 var(--body);transition:transform .08s}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--s2)}
.choice .ic{font-size:24px;width:34px;text-align:center}
.choice small{display:block;color:var(--mu);font-size:13px;margin-top:2px}
.choice.on{border-color:var(--vio);background:rgba(123,92,255,.14);box-shadow:0 4px 0 var(--vioD)}
.input{width:100%;padding:18px;border-radius:16px;border:2px solid var(--s3);background:var(--s1);color:var(--tx);font:600 20px var(--body);outline:none}
.input:focus{border-color:var(--vio)}
.logo{font:800 54px/1 var(--disp);letter-spacing:-.03em}
.logo span{color:var(--lime)}
.bubble{position:relative;background:var(--s1);border:2px solid var(--s2);border-radius:18px;padding:12px 14px;font-size:15px;line-height:1.4}
.bubble::before{content:"";position:absolute;left:-9px;top:20px;width:14px;height:14px;background:var(--s1);border-left:2px solid var(--s2);border-bottom:2px solid var(--s2);transform:rotate(45deg)}
.check-step{display:flex;align-items:center;gap:12px;padding:10px 0;opacity:.3;transition:opacity .3s}
.check-step.done{opacity:1}
.check-step b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--s3);font-size:14px}
.check-step.done b{background:var(--lime);color:#13200A}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;gap:8px}
.stat{display:flex;align-items:center;gap:5px;font:800 16px/1 var(--disp)}
.rankpill{display:flex;align-items:center;gap:7px;padding:7px 12px 7px 8px;border-radius:999px;background:var(--s2);font:800 13px/1 var(--disp);letter-spacing:.02em;cursor:pointer;border:0}
.rankpill i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--lime);color:#13200A;font-style:normal;font-size:12px}

/* Kingdom chips */
.kchips{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 12px;scrollbar-width:none}
.kchips::-webkit-scrollbar{display:none}
.kchip{flex:none;display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:14px;background:var(--s1);border:2px solid var(--s2);font:700 14px var(--body);cursor:pointer}
.kchip.on{border-color:var(--k);background:color-mix(in srgb,var(--k) 16%,var(--s1))}
.kchip.lock{opacity:.45}
.kchip .star{font-size:10px;color:var(--gold)}

/* Map */
.unit{margin:6px 18px 6px;border-radius:20px;padding:16px 18px;background:var(--k);color:#120f22;position:relative;overflow:hidden}
.unit h3{font-size:20px}
.unit p{margin:4px 0 0;font:600 14px var(--body);opacity:.8}
.unit .ttag{font:800 11px var(--disp);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.unit::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18)}
.path{position:relative;padding:44px 0 10px;display:flex;flex-direction:column;align-items:center;gap:20px}
.node{position:relative;width:76px;height:70px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;font-size:30px;background:var(--k);color:#120f22;box-shadow:0 8px 0 color-mix(in srgb,var(--k) 55%,#000);transition:transform .1s}
.node:active{transform:translateY(5px);box-shadow:0 3px 0 color-mix(in srgb,var(--k) 55%,#000)}
.node.lock{background:var(--s3);box-shadow:0 8px 0 #1f1a3d;color:#6f68a0;cursor:pointer}
.node.cur::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--k);animation:ring 1.6s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:scale(.92);opacity:.8}to{transform:scale(1.3);opacity:0}}
.node.done{background:color-mix(in srgb,var(--k) 85%,#fff)}
.node .lbl{position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:var(--tx);color:#120f22;font:800 12px var(--disp);letter-spacing:.08em;padding:7px 11px;border-radius:10px;white-space:nowrap;animation:bob 1.8s ease-in-out infinite}
.node .lbl::after{content:"";position:absolute;bottom:-5px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--tx)}
.mapmentor{display:flex;gap:10px;align-items:flex-start;padding:4px 18px 4px}
.mapmentor .bubble{flex:1;font-size:14px}

/* ---------- MAP: climb the mountain, bottom to top ---------- */
.mtn{position:relative;width:100%;aspect-ratio:360/560;margin:6px 0 0;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,#14112a 0%,#1d1940 55%,#251f4d 100%)}
.mtn>svg.scene{position:absolute;inset:0;width:100%;height:100%}
.mpt{position:absolute;transform:translate(-50%,-50%);z-index:2}
.mpt .node{width:62px;height:58px;font-size:26px}
.mpt.summit .node{width:80px;height:72px;font-size:34px}
.mlab{position:absolute;transform:translateY(-50%);z-index:1;font:800 13px/1.2 var(--disp);color:var(--tx);white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.mlab small{display:block;font:600 11px var(--body);color:var(--mu);letter-spacing:0}
.mlab.lock{color:#bdb6e6}
.mlab.r{text-align:left}.mlab.l{text-align:right}
.mhere{position:absolute;z-index:3;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.mhere .hb{width:46px;height:46px;border-radius:50%;background:#FCF3EA;border:3px solid var(--tx);overflow:hidden;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.mhere .hb svg{width:100%;height:100%;display:block}
.mhere span{background:var(--tx);color:#120f22;font:800 10px var(--disp);letter-spacing:.08em;padding:3px 7px;border-radius:8px;white-space:nowrap}
.mtn .lbl{top:auto;bottom:-34px}
.mtn .lbl::after{bottom:auto;top:-5px;border-top:0;border-bottom:6px solid var(--tx)}

.nextunit{margin:10px 18px 30px;padding:16px;border-radius:18px;border:2px dashed var(--s3);text-align:center;color:var(--mu);font-weight:600}

/* Nav */
.nav{display:flex;justify-content:space-around;padding:8px 6px 10px;border-top:2px solid var(--s2);background:var(--bg)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:700 11px var(--body);color:var(--mu);padding:6px 7px;border-radius:12px;cursor:pointer}
.nav button span{font-size:22px;filter:grayscale(.8);opacity:.7}
.nav button.on{color:var(--tx);background:var(--s2)}
.nav button.on span{filter:none;opacity:1}

/* Lesson */
.lhdr{display:flex;align-items:center;gap:12px;padding:16px 18px 6px}
.lhdr .x{background:none;border:0;font-size:24px;color:var(--mu);cursor:pointer;padding:0 4px}
.lhdr .bar{flex:1;height:16px}
.combo{height:26px;display:flex;justify-content:center;align-items:center}
.combo span{font:800 13px var(--disp);letter-spacing:.06em;color:var(--gold);padding:4px 10px;border-radius:99px;background:rgba(255,200,61,.12)}
.lbody{flex:1;overflow-y:auto;padding:4px 20px 20px;scrollbar-width:none}
.tag{display:inline-flex;align-items:center;gap:6px;font:800 12px var(--disp);letter-spacing:.12em;color:var(--k);margin:6px 0 10px}
.q{font-size:23px;line-height:1.22;margin-bottom:18px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:16px;background:var(--s1);border:2px solid var(--s2);box-shadow:0 4px 0 var(--s2);cursor:pointer;font:500 16px/1.35 var(--body)}
.opt .key{flex:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--s3);display:grid;place-items:center;font:700 13px var(--body);color:var(--mu)}
.opt.on{border-color:var(--cyan);background:rgba(54,214,255,.1);box-shadow:0 4px 0 #1a7f99}
.opt.on .key{border-color:var(--cyan);color:var(--cyan)}
.opt.right{border-color:var(--ok);background:var(--okBg);box-shadow:0 4px 0 #1f8a52}
.opt.wrong{border-color:var(--bad);background:var(--badBg);box-shadow:0 4px 0 #8a2733}
.situ{background:linear-gradient(135deg,rgba(123,92,255,.18),rgba(54,214,255,.08));border:2px solid rgba(123,92,255,.35);border-radius:18px;padding:14px 16px;margin-bottom:16px;font:500 16px/1.45 var(--body)}
.lfoot{padding:14px 20px 18px;border-top:2px solid var(--s2)}
.hint{text-align:center;color:var(--mu);font-size:14px;padding:6px}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:20px 20px 22px;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1.1);z-index:5;border-radius:24px 24px 0 0;max-height:72%;overflow-y:auto}
.sheet.show{transform:none}
.sheet.ok{background:var(--okBg);border-top:3px solid var(--ok)}
.sheet.bad{background:var(--badBg);border-top:3px solid var(--bad)}
.sheet h3{font-size:22px;display:flex;align-items:center;gap:8px}
.sheet.ok h3{color:var(--ok)}.sheet.bad h3{color:var(--bad)}
.sheet p{margin:8px 0 0;line-height:1.45;font-size:15px}
.sheet .ans{margin-top:8px;font-weight:700}
.sheet .btn{margin-top:16px}
.sheet.ok .btn{background:var(--ok);box-shadow:0 5px 0 #1f8a52}
.sheet.bad .btn{background:var(--bad);box-shadow:0 5px 0 #8a2733}
.xpfly{position:absolute;font:800 20px var(--disp);color:var(--lime);pointer-events:none;animation:fly 1s ease-out forwards;z-index:9}
@keyframes fly{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}

/* Swipe */
.swwrap{position:relative;height:330px;display:grid;place-items:center;margin-top:6px}
.swcard{position:relative;width:100%;height:300px;border-radius:26px;background:linear-gradient(160deg,#2b2556,#1b1735);border:2px solid #3b3370;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;font:800 24px/1.25 var(--disp);touch-action:none;cursor:grab;transition:transform .3s,opacity .3s;user-select:none;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.swcard .st{position:absolute;top:18px;font:800 18px var(--disp);letter-spacing:.1em;padding:6px 12px;border-radius:10px;border:3px solid;opacity:0}
.swcard .st.t{right:18px;color:var(--ok);transform:rotate(10deg)}
.swcard .st.m{left:18px;color:var(--bad);transform:rotate(-10deg)}
.swbtns{display:flex;justify-content:center;gap:40px;margin-top:16px}
.swbtns button{width:72px;height:72px;border-radius:50%;border:0;font-size:28px;cursor:pointer;font-weight:800}
.swbtns .m{background:var(--badBg);color:var(--bad);box-shadow:0 5px 0 #8a2733}
.swbtns .t{background:var(--okBg);color:var(--ok);box-shadow:0 5px 0 #1f8a52}
.swbtns small{display:block;font:800 11px var(--disp);letter-spacing:.1em;margin-top:8px;text-align:center}

/* Match */
.mgrid{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mt{min-height:58px;padding:10px 12px;border-radius:14px;background:var(--s1);border:2px solid var(--s2);box-shadow:0 4px 0 var(--s2);cursor:pointer;font:600 14px/1.25 var(--body);text-align:left;transition:opacity .3s,transform .1s}
.mt.term{font:800 15px var(--disp);text-align:center}
.mt.on{border-color:var(--cyan);background:rgba(54,214,255,.1);box-shadow:0 4px 0 #1a7f99}
.mt.ok{border-color:var(--ok);background:var(--okBg);opacity:.25;pointer-events:none;box-shadow:none}
.mt.no{animation:shake .35s;border-color:var(--bad)}

/* Order */
.oseq{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.oslot{min-height:50px;border-radius:14px;border:2px dashed var(--s3);display:flex;align-items:center;gap:10px;padding:8px 12px;color:var(--mu);font:600 15px var(--body)}
.oslot.f{border-style:solid;border-color:var(--cyan);background:rgba(54,214,255,.08);color:var(--tx);cursor:pointer}
.oslot b{width:26px;height:26px;border-radius:8px;background:var(--s3);display:grid;place-items:center;font-size:13px;flex:none}
.oslot.f b{background:var(--cyan);color:#06222b}
.opool{display:flex;flex-wrap:wrap;gap:8px}
.opool button{padding:11px 13px;border-radius:13px;background:var(--s1);border:2px solid var(--s2);box-shadow:0 4px 0 var(--s2);font:600 14px var(--body);cursor:pointer}
.opool button.used{visibility:hidden}

/* Arena */
.arena{display:flex;flex-direction:column;gap:12px}
.ad{position:relative;border-radius:18px;background:var(--s1);border:2px solid var(--s2);box-shadow:0 4px 0 var(--s2);padding:14px;cursor:pointer;text-align:left;width:100%}
.ad .adh{display:flex;align-items:center;gap:8px;font:700 13px var(--body);color:var(--mu);margin-bottom:10px}
.ad .adh i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;font:800 13px var(--disp);color:#120f22}
.ad .adb{font:700 18px/1.3 var(--disp)}
.ad.on{border-color:var(--cyan);background:rgba(54,214,255,.08);box-shadow:0 4px 0 #1a7f99}
.ad.win{border-color:var(--ok)}
.ad .crown{position:absolute;right:12px;top:10px;font-size:22px}
.vs{text-align:center;font:800 14px var(--disp);color:var(--mu);letter-spacing:.2em}

/* Budget */
.brow{background:var(--s1);border:2px solid var(--s2);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.brow .row{font-weight:700}
.brow output{margin-left:auto;font:800 16px var(--disp);color:var(--lime)}
input[type=range]{width:100%;margin-top:10px;-webkit-appearance:none;appearance:none;height:10px;border-radius:9px;background:var(--s3);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--lime);border:4px solid #13200A;cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--lime);border:4px solid #13200A;cursor:pointer}
.remain{display:flex;justify-content:space-between;align-items:center;font:800 15px var(--disp);margin-bottom:12px}
.simbars{margin-top:10px}
.simbars div{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.simbars span{width:90px;flex:none}
.simbars em{flex:1;height:10px;border-radius:9px;background:rgba(255,255,255,.12);position:relative;overflow:hidden;font-style:normal}
.simbars em i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:9px}
.stars{font-size:26px;letter-spacing:4px}

/* Overlays */
#ov{position:absolute;inset:0;z-index:20;display:none;background:rgba(10,8,20,.82);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:24px}
#ov.show{display:flex}
.modal{width:100%;max-width:380px;background:var(--s1);border:2px solid var(--s2);border-radius:28px;padding:26px 22px;text-align:center}
.modal h2{font-size:28px;margin:10px 0 6px}
.modal p{color:var(--mu);line-height:1.45;margin:6px 0 18px}
.modal .btn+.btn{margin-top:12px}
.big{font:800 64px/1 var(--disp)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.statbox{border-radius:16px;border:2px solid var(--c);overflow:hidden}
.statbox small{display:block;background:var(--c);color:#120f22;font:800 11px var(--disp);letter-spacing:.1em;padding:6px 4px}
.statbox b{display:block;padding:12px 4px;font:800 22px var(--disp)}
.chest{font-size:96px;display:inline-block;cursor:pointer;transition:transform .2s}
.chest.wob{animation:shake .5s infinite}
#toast{position:absolute;top:14px;left:50%;transform:translate(-50%,-140%);z-index:30;background:var(--tx);color:#120f22;border-radius:16px;padding:12px 16px;font:700 14px var(--body);display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);width:max-content;max-width:90%}
#toast.show{transform:translate(-50%,0)}
#toast .ti{font-size:26px}
#cf{position:absolute;inset:0;pointer-events:none;z-index:40}

/* Tabs */

/* ---------- CAST: the single registry for every character ----------
   To add a character: put <id>.svg in assets/2d and <id>.webp in assets/3d,
   add one CAST entry below, and if it is a mentor add its lines in MENTORS
   with the same id plus a kingdom in K. No screen code changes. */
const ASSET='assets/';
const CAST={
 'klimb-goat':{n:'Klimb',role:'Your career guide',main:'#FF751A',accent:'#2F5BE0',plate:'#FFF1E5',skin:'fleece'},

 'the-chair':{n:'The Chair',main:'#CE4661',accent:'#12A06E',plate:'#FAEBEE',skin:'lilac'},
 'coach-bidwell':{n:'Coach Bidwell',main:'#CE5846',accent:'#1FBFC6',plate:'#FAEDEB',skin:'orange'},
 'carla-closewell':{n:'Carla Closewell',main:'#FFC414',accent:'#3E37C8',plate:'#FFF8DB',skin:'orange'},

 'algorithm-oracle':{n:'The Algorithm Oracle',main:'#3C4567',accent:'#FFAE1A',plate:'#EFF1F5',skin:'lilac'},
 'the-guru':{n:'The Guru',main:'#A9CE46',accent:'#8A3FF0',plate:'#F6FAEB',skin:'lilac'}};
const art2d=id=>`${ASSET}2d/${id}.svg`;
const art3d=(id,v)=>`${ASSET}3d/${id}${v?'-'+v:''}.webp`;
/* 2D: everyday UI (chat, feedback, map, lists). fx: 'hop' | 'shake' | 'round' | 'sad' */
function av2d(id,s,fx=''){const c=CAST[id];return `<div class="cav ${fx}" style="--sz:${s}px;--pl:${c.plate};--mc:${c.main}"><img src="${art2d(id)}" alt="${c.n}" decoding="async"></div>`}
/* 3D: big moments only (onboarding, mentor intros, promotions). The 2D shows until the 3D has loaded. */
function av3d(id,w,v,cls=''){const c=CAST[id];return `<div class="c3d ${v==='wave'?'sq':''} ${cls}" style="--w:${w}px;--pl:${c.plate};--mc:${c.main}"><img class="ph" src="${art2d(id)}" alt=""><img class="r3" src="${art3d(id,v)}" alt="${c.n}" loading="lazy" decoding="async" onload="this.parentNode.classList.add('in')"></div>`}
/* Klimb the Goat, the guide (replaces Pip) */
const klimb=(s=90,mood='')=>av2d('klimb-goat',s,mood==='sad'?'sad':mood==='wow'?'hop':'');
const klimbImg=(x,y,w)=>`<image href="${art2d('klimb-goat')}" x="${x}" y="${y}" width="${w}" height="${w*1.2}"/>`;

function bVal(ch,x){return ch.k*ch.cap*(1-Math.exp(-x/ch.cap))}
function bOpt(it){let a=it.ch.map(()=>0);for(let s=0;s<it.total/it.step;s++){let bi=0,bg=-1;it.ch.forEach((c,i)=>{const g=bVal(c,a[i]+it.step)-bVal(c,a[i]);if(g>bg){bg=g;bi=i}});a[bi]+=it.step}return a}
function bSet(j,el){const it=L.it;const others=L.alloc.reduce((s,v,i)=>i===j?s:s+v,0);let v=Math.min(+el.value,it.total-others);el.value=v;L.alloc[j]=v;$('#bo'+j).textContent=fmt(v);const rem=it.total-L.alloc.reduce((a,b)=>a+b,0);$('#rem').textContent=fmt(rem);$('#rem').style.color=rem?'var(--gold)':'var(--lime)';$('#remb').style.width=(100-rem/it.total*100)+'%';ready(rem===0)}

function doCheck(){if(L.answered)return;const it=L.it;let ok=false,extra='';
 if(it.t==='mc'||it.t==='sc'){ok=L.order[L.sel]===it.a;document.querySelectorAll('.opt').forEach(o=>{const oi=L.order[+o.dataset.j];if(oi===it.a)o.classList.add('right');else if(+o.dataset.j===L.sel)o.classList.add('wrong')})}
 if(it.t==='order'){ok=L.seq.every((v,j)=>v===j);if(ok)S.cnt.order++}
 if(it.t==='arena'){ok=L.sel===it.a;if(ok)S.cnt.arena++;document.querySelectorAll('.ad').forEach(a=>{if(a.dataset.s===it.a){a.classList.add('win');a.insertAdjacentHTML('beforeend','<span class="crown pop">👑</span>')}})}
 if(it.t==='budget'){const opt=bOpt(it);const ov=it.ch.reduce((s,c,i)=>s+bVal(c,opt[i]),0),mv=it.ch.reduce((s,c,i)=>s+bVal(c,L.alloc[i]),0);const sc=mv/ov;const stars=sc>=.98?3:sc>=.93?2:sc>=.85?1:0;ok=sc>=.93;if(stars===3)S.cnt.budget3++;
  const mx=Math.max(...it.ch.map((c,i)=>bVal(c,L.alloc[i])),...it.ch.map((c,i)=>bVal(c,opt[i])));
  extra=`<div class="stars">${'★'.repeat(stars)}<span style="opacity:.25">${'★'.repeat(3-stars)}</span></div><div style="font:800 18px var(--disp)">${fmt(mv*it.mult)} ${it.unit} · ${Math.round(sc*100)}% of optimal</div><div class="simbars">${it.ch.map((c,i)=>`<div><span>${c.n}</span><em><i style="width:${bVal(c,L.alloc[i])/mx*100}%"></i></em><small style="width:58px;text-align:right">${fmt(L.alloc[i])}</small></div>`).join('')}</div><div class="mu" style="font-size:13px;margin-top:6px">Optimal mix: ${it.ch.map((c,i)=>`${c.n} ${fmt(opt[i])}`).join(' · ')}</div>`}
 answer(ok,extra)}

const PRAISE=['Nice!','Sharp call!','Exactly.','Strategist energy!','Boardroom ready!','Big brain move.','Clean.'];
function answer(ok,extra=''){
 L.answered=true;const it=L.it;const kid=it.id.split(':')[0];L.modes.add(it.t);
 S.mastery[kid]=S.mastery[kid]||{c:0,t:0};S.mastery[kid].t++;S.seen[it.id]=(S.seen[it.id]||0)+1;
 let gain=0;
 if(ok){L.combo++;L.best=Math.max(L.best,L.combo);L.right++;S.mastery[kid].c++;
  gain=Math.round(10*(1+Math.min(L.combo,10)*.1))*(L.mode==='boss'?2:1);L.xp+=gain;
  S.missed=S.missed.filter(x=>x!==it.id);snd(L.combo>=3&&L.combo%3===0?'combo':'ok');buzz(25)}
 else{L.combo=0;L.wrong++;S.hearts=Math.max(0,S.hearts-1);if(!S.missed.includes(it.id))S.missed.push(it.id);if(L.mode==='lesson'||L.mode==='boss'){S.mod[L.kid]=S.mod[L.kid]||[];if(!S.mod[L.kid].includes(it.id))S.mod[L.kid].push(it.id)}snd('bad');buzz([60,40,60]);const lb=$('#lb');lb&&(lb.style.animation='shake .35s')}
 S.bestCombo=Math.max(S.bestCombo,L.combo);S.todayBest=Math.max(S.todayBest,L.combo);
 if(!S.todayModes.includes(it.t))S.todayModes.push(it.t);
 save();
 let ans='';
 if(!ok){if(it.t==='mc'||it.t==='sc')ans=`Answer: ${skin(it.o[it.a])}`;if(it.t==='swipe')ans=`It's a ${it.a?'TRUTH':'MYTH'}.`;if(it.t==='arena')ans=`Winner: ${skin(it[it.a])}`;if(it.t==='order')ans='Right order: '+it.st.map((s,i)=>`${i+1}. ${s}`).join('  ')}
 const M=mentorOf();const title=ok?(it.t==='swipe'&&!it.a?'Guru busted! 💥':L.combo>=3?`🔥 ${L.combo} in a row!`:pick(PRAISE)):pick(['Not quite.','Close, but no.','Good try.']);
 const sh=$('#sheet');
 sh.className='sheet '+(ok?'ok':'bad');
 sh.innerHTML=`<h3>${ok?'✓':'✕'} ${title}${ok?`<span style="margin-left:auto;font-size:16px;color:var(--lime)">+${gain} XP</span>`:''}</h3>${extra?`<div style="margin-top:8px">${extra}</div>`:''}${ans?`<div class="ans">${ans}</div>`:''}<p>${skin(it.ex)}</p><div class="mentorsay">${mav(M,40,ok?'hop':'shake')}<span>"${ok?pick(M.right):pick(M.wrong)}"</span></div>${!ok?`<p class="mu" style="font-size:13px">${L.mode==='lesson'||L.mode==='boss'?'🔧 Saved for this module\'s Fix-it Round.':'🌀 Saved to your Review Rift.'}</p>`:''}<button class="btn" id="cont" onclick="nextItem()">Continue</button>`;
 requestAnimationFrame(()=>sh.classList.add('show'));
 const f=$('#lf');if(f)f.style.visibility='hidden';
 const bar=$('.lhdr .bar i');if(bar)bar.style.width=((L.i+1)/L.ids.length*100)+'%';
 const hs=$('.lhdr .stat span');if(hs)hs.textContent=S.hearts;
}
function nextItem(){
 if(S.hearts<=0&&L.i<L.ids.length-1){outOfHearts(false);return}
 L.i++;if(L.i>=L.ids.length){finishLesson();return}showItem()}
function quitLesson(){const M=mentorOf();ov(`<div class="row" style="justify-content:center">${mav(M,84)}</div><h2 style="font-size:24px">"${M.quit}"</h2><p>You'll lose the XP from this run. Your streak is safe if you already played today.</p><button class="btn" onclick="closeOv()">Keep going</button><button class="btn ghost" onclick="closeOv();L=null;renderMain()">Quit anyway</button>`)}
function outOfHearts(fromMap){
 ov(`<div class="big">💔</div><h2>Out of hearts</h2><p>Mistakes are how you learn. Refill and keep going, or come back tomorrow for a full set.</p><button class="btn" ${S.coins<30?'disabled':''} onclick="refill(${fromMap})">Refill for 30 🪙</button><button class="btn ghost" onclick="closeOv();L=null;renderMain()">${fromMap?'Not now':'End lesson'}</button>`)}
function refill(fromMap){S.coins-=30;S.hearts=maxHearts();save();closeOv();snd('chest');if(fromMap){renderMain();toast('❤️','Hearts refilled!')}else{L.i++;if(L.i>=L.ids.length)finishLesson();else showItem()}}

/* ---------- FINISH + REWARD CEREMONY ---------- */
function finishLesson(){
 const total=L.ids.length,acc=Math.round(L.right/total*100);const perfect=L.wrong===0;const kid=L.kid,mode=L.mode;const M=kid?MENTORS[kid]:null;
 const bonus=15+(perfect?10:0)+(mode==='boss'?30:0);L.xp+=bonus;
 const before=overallRank();const lvlBefore=kid?klevel(kid):0;
 S.xp+=L.xp;S.weekXp+=L.xp;S.todayXp+=L.xp;S.lessons++;if(perfect)S.perfect++;
 S.bots.forEach(b=>b.xp+=Math.round(Math.random()*70));
 const pay=Math.round(10*payMult())+(mode==='fixit'&&has('whiteboard')?15:0);S.coins+=pay;
 let clientWin=false,clientPay=0;const C=mode==='client'?CLIENTS.find(x=>x.id===CUR_CLIENT):null;
 if(C){S.clientDone[C.id]=today();if(acc>=70){clientWin=true;clientPay=Math.round(C.reward*(has('accman')?1.25:1));S.coins+=clientPay;S.cnt.client++}}
 let bossWin=false;
 if(mode==='lesson')S.progress[kid]=(S.progress[kid]||0)+1;
 if(mode==='fixit'){S.progress[kid]=(S.progress[kid]||0)+1;S.mod[kid]=[];S.cnt.fixit++}
 if(mode==='boss'&&acc>=70){bossWin=true;S.bosses++;S.progress[kid]=(S.progress[kid]||0)+1;S.mod[kid]=[]}
 if(mode==='review')S.hearts=Math.min(maxHearts(),S.hearts+1);
 const lvlAfter=kid?klevel(kid):0;const raise=bossWin?(lvlAfter>lvlBefore?SAL[lvlAfter]-SAL[lvlBefore]:10000):0;if(raise)S.coins+=Math.round(raise/100);
 let streakUp=false;const t=today();
 if(S.lastDay!==t){S.streak=(S.lastDay===today(-1))?S.streak+1:1;S.lastDay=t;if(!S.played.includes(t))S.played.push(t);S.played=S.played.slice(-30);streakUp=true}
 const lucky=Math.random()<.25?5+Math.round(Math.random()*15):0;if(lucky)S.coins+=lucky;
 const after=overallRank();save();
 const q=[];
 q.push(()=>{snd('win');if(perfect||bossWin)confetti();
  const head=C?(clientWin?`${C.n} is thrilled!`:`${C.n} wasn't convinced`):mode==='boss'?(bossWin?'Promotion Review passed!':'Promotion postponed'):mode==='fixit'?'Mistakes fixed!':perfect?'Flawless lesson!':'Lesson complete!';
  return `<div class="bob" style="display:flex;justify-content:center">${M?mav(M,92,bossWin?'hop':''):klimb(96)}</div><h2>${head}</h2>${mode==='boss'&&!bossWin?`<p>You need 70% to pass. "${M.wrong[0]}"</p>`:''}${C?(clientWin?`<p style="margin:4px 0 0">Invoice paid: <b style="color:var(--gold)">+${clientPay} 🪙</b></p>`:'<p style="margin:4px 0 0">You need 70% to win the account. The client is back tomorrow.</p>'):''}
  <div class="statgrid"><div class="statbox" style="--c:var(--lime)"><small>TOTAL XP</small><b>${L.xp}</b></div><div class="statbox" style="--c:var(--cyan)"><small>ACCURACY</small><b>${acc}%</b></div><div class="statbox" style="--c:var(--gold)"><small>BEST COMBO</small><b>${L.best}</b></div></div>
  <p style="margin-top:0">🪙 Paycheck: <b style="color:var(--gold)">+${pay}</b>${lucky?` · 🍀 Bonus: <b style="color:var(--gold)">+${lucky}</b>`:''}${mode==='review'?' · ❤️ +1 heart':''}</p>`});
 if(bossWin){const k=KG(kid);q.push(()=>{snd('rank');confetti();return `<div class="mu" style="font:800 12px var(--disp);letter-spacing:.14em;color:var(--lime)">YOU GOT PROMOTED</div><div style="margin:12px 0">${av3d(M.id,130)}</div><div class="letter"><h4>PROMOTION LETTER · ${k.n.toUpperCase()}</h4>Dear ${esc(S.name)},<br><br>Effective today you are promoted to <b>${RANKS[lvlAfter].n}, ${k.s}</b>.<br><br><span style="color:#7a7390;font-size:12px;font-weight:700;letter-spacing:.1em">NEW GAME SALARY</span><div class="sal">${eur(SAL[lvlAfter])} <span style="font-size:15px">(+${eur(raise)})</span></div>"${M.promo}"<div class="sig">${M.n}</div></div><p style="margin:10px 0 0">Raise paid: <b style="color:var(--gold)">+${Math.round(raise/100)} 🪙</b></p>`});
  q.push(()=>`<div class="mu" style="font:800 12px var(--disp);letter-spacing:.14em">PROMOTION BONUS</div><h2>Victory chest</h2><div style="margin:18px 0"><span class="chest wob" id="ch">🎁</span></div><p>Tap to open</p>`)}
 if(streakUp)q.push(()=>{snd('combo');return `<div class="big pop" style="font-size:90px">🔥</div><h2>${S.streak} day streak!</h2><p>${S.streak===1?'Day one. Come back tomorrow to keep the flame alive.':`You've shown up ${S.streak} days in a row. Consistency is the real career hack.`}</p><div class="week">${weekDots()}</div>`});
 if(after>before)q.push(()=>{snd('rank');confetti();const R=RANKS[after];return `<div class="mu" style="font:800 12px var(--disp);letter-spacing:.14em;color:var(--lime)">CAREER PROMOTION</div><div class="bob" style="margin:12px 0">${av3d('klimb-goat',150)}</div><h2>Your overall title: ${R.n}!</h2><p>Your three strongest tracks now average ${R.n}. New thinking mode: <b style="color:var(--tx)">${R.mode}</b>.</p>${after>=3&&before<3?'<p style="color:var(--gold);font-weight:700">👑 Leadership and Finance unlocked, with The Chair</p>':''}`});
 runFlow(q,()=>{L=null;if(C)S.tab='hq';renderMain();checkMedals();if(kid)showPush(kid,mode,bossWin)});
}
function runFlow(q,done){let i=0;const step=()=>{if(i>=q.length){closeOv();done();return}const html=q[i++]();ov(html+`<button class="btn" id="fl" style="margin-top:20px">Continue</button>`);
 const ch=$('#ch');if(ch){$('#fl').style.display='none';ch.onclick=()=>{const Lt=rollLoot();Lt.f();save();snd('chest');buzz([30,40,60]);if(Lt.t==='lucky')confetti();ov(`<div class="big pop">${Lt.ic}</div><h2>${Lt.txt}</h2><button class="btn" id="fl" style="margin-top:20px">Continue</button>`);$('#fl').onclick=step}}
 $('#fl').onclick=step};step()}
function weekDots(){const lab=['M','T','W','T','F','S','S'];const d=new Date();const dow=(d.getDay()+6)%7;return lab.map((l,i)=>{const day=today(i-dow);const on=S.played.includes(day);return `<div class="${on?'on':''}">${l}<span>${on?'🔥':i===dow?'·':''}</span></div>`}).join('')}
function checkMedals(){let delay=0;MEDALS.forEach(m=>{if(!S.medals[m[0]]&&m[5](S)){S.medals[m[0]]=today();setTimeout(()=>{toast(m[2],`Medal unlocked: <b>${m[1]}</b>`);snd('chest')},300+delay);delay+=2800}});save()}

<script>

 const ok=n=>{const p=n.parentNode;if(!p||!p.closest||p.closest('svg,textarea,input,script,style,title'))return false;RX.lastIndex=0;return RX.test(n.nodeValue)};
 function fix(root){if(!root)return;if(root.nodeType===3){if(ok(root))swap(root);return}if(root.nodeType!==1)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const list=[];while(w.nextNode())if(ok(w.currentNode))list.push(w.currentNode);list.forEach(swap)}
 function swap(n){RX.lastIndex=0;const h=esc(n.nodeValue).replace(RX,(m,e)=>`<svg class="ki" aria-hidden="true"><use href="#ki-${EMO[e]||EMO[e.replace('️','')]}"/></svg>`);const t=document.createElement('template');t.innerHTML=h;n.replaceWith(t.content)}
 window.kiFix=fix;fix(document.body);
 new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='characterData')fix(m.target);else m.addedNodes.forEach(fix)})).observe(document.body,{childList:true,subtree:true,characterData:true});
})();

/* keep 2D instant: warm every 2D file once */
Object.keys(CAST).forEach(id=>{const i=new Image();i.src=art2d(id)});
